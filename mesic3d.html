<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Měsíc 3D – vlny příšer</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: "Trebuchet MS", "Segoe UI", sans-serif; color: #eef1ff; }
  canvas { display: block; }
  #hud { position: fixed; top: 12px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; text-shadow: 0 1px 4px #000; font-size: 1.05rem; }
  #bar { width: 220px; height: 14px; background: #1b2236; border: 2px solid #eef1ff; border-radius: 8px; overflow: hidden; margin-top: 4px; }
  #hp { height: 100%; width: 100%; background: #4be08a; transition: width .15s; }
  #cross { position: fixed; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border: 2px solid #fff; border-radius: 50%; opacity: .8; pointer-events: none; }
  #banner { position: fixed; top: 22%; width: 100%; text-align: center; font-size: clamp(2rem, 7vw, 4rem); font-weight: bold; opacity: 0; pointer-events: none; text-shadow: 0 2px 10px #000; transition: opacity .5s; }
  #msg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: rgba(0,0,0,.72); text-align: center; cursor: pointer; padding: 20px; }
  #msg h1 { margin: 0; font-size: clamp(1.8rem, 6vw, 3rem); }
  #msg p { margin: 0; color: #a9b3df; }
  #msg.hidden { display: none; }
</style>
</head>
<body>
<div id="hud">
  <div>Zdraví<div id="bar"><div id="hp"></div></div></div>
  <div style="text-align:center">Vlna <b id="wave">1</b><br>Zbývá nepřátel: <b id="left">0</b></div>
  <div style="text-align:right">Skóre: <b id="score">0</b></div>
</div>
<div id="cross"></div>
<div id="banner"></div>
<div id="msg">
  <h1 id="title">Měsíc 3D</h1>
  <p id="sub">Přežij vlny příšer na povrchu Měsíce.</p>
  <p>WASD – pohyb · myš – rozhlížení · levé tlačítko – střelba · mezerník – skok · Esc – pauza</p>
  <p><b>Klikni pro start</b></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);
  scene.fog = new THREE.Fog(0x000000, 70, 150);
  const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 600);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0x7a82a8, 0.7));
  const sun = new THREE.DirectionalLight(0xffffff, 1.3);
  sun.position.set(60, 80, 30);
  scene.add(sun);

  // ---------- Prostředí ----------
  const craters = [];
  for (let i = 0; i < 16; i++) {
    const a = rnd(0, 6.28), d = rnd(18, 95);
    craters.push({ x: Math.cos(a) * d, z: Math.sin(a) * d, r: rnd(5, 12) });
  }
  function H(x, z) {
    let h = Math.sin(x * .05) * Math.cos(z * .04) * 2.2 + Math.sin(x * .13 + z * .09) * .7;
    for (const c of craters) {
      const d = Math.hypot(x - c.x, z - c.z) / c.r;
      if (d < 1) h -= (1 - d * d) * c.r * .3;
      else if (d < 1.35) h += Math.sin((d - 1) / .35 * Math.PI) * c.r * .08;
    }
    return h;
  }
  const tg = new THREE.PlaneGeometry(260, 260, 130, 130);
  tg.rotateX(-Math.PI / 2);
  const tp = tg.attributes.position;
  for (let i = 0; i < tp.count; i++) tp.setY(i, H(tp.getX(i), tp.getZ(i)));
  tg.computeVertexNormals();
  scene.add(new THREE.Mesh(tg, new THREE.MeshStandardMaterial({ color: 0x8e909a, flatShading: true })));

  const rockM = new THREE.MeshStandardMaterial({ color: 0x6c6e78, flatShading: true });
  for (let i = 0; i < 45; i++) {
    const x = rnd(-110, 110), z = rnd(-110, 110);
    if (Math.hypot(x, z) < 8) continue;
    const r = new THREE.Mesh(new THREE.DodecahedronGeometry(rnd(.5, 1.6)), rockM);
    r.position.set(x, H(x, z) + .2, z);
    r.rotation.set(rnd(0, 3), rnd(0, 3), 0);
    scene.add(r);
  }
  const sp = [];
  for (let i = 0; i < 900; i++) { const a = rnd(0, 6.28), e = rnd(.05, 1.3), r = 400; sp.push(Math.cos(a) * Math.cos(e) * r, Math.sin(e) * r, Math.sin(a) * Math.cos(e) * r); }
  const sgeo = new THREE.BufferGeometry();
  sgeo.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
  scene.add(new THREE.Points(sgeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, fog: false })));
  const earth = new THREE.Mesh(new THREE.SphereGeometry(40, 32, 32), new THREE.MeshBasicMaterial({ color: 0x3a7bd5, fog: false }));
  earth.position.set(-220, 160, -330);
  scene.add(earth);

  // ---------- Astronaut ----------
  const white = new THREE.MeshStandardMaterial({ color: 0xf2f4f8 });
  const box = (w, h, d, m, x, y, z, par) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); par.add(o); return o; };
  const P = new THREE.Group();
  box(.9, 1.1, .55, white, 0, 1.5, 0, P);
  box(.7, .9, .35, new THREE.MeshStandardMaterial({ color: 0xc4c8d4 }), 0, 1.55, -.45, P);
  const head = new THREE.Mesh(new THREE.SphereGeometry(.44, 16, 16), white); head.position.y = 2.4; P.add(head);
  const visor = new THREE.Mesh(new THREE.SphereGeometry(.34, 16, 16), new THREE.MeshStandardMaterial({ color: 0x10131f, roughness: .2, metalness: .6 }));
  visor.scale.z = .6; visor.position.set(0, 2.42, .26); P.add(visor);
  const legs = [-1, 1].map(s => { const g = new THREE.Group(); g.position.set(s * .22, 1, 0); box(.32, .95, .32, white, 0, -.45, 0, g); P.add(g); return g; });
  box(.25, .8, .25, white, -.6, 1.6, 0, P);
  box(.25, .7, .25, white, .6, 1.75, .25, P).rotation.x = -1.1;
  box(.15, .2, .9, new THREE.MeshStandardMaterial({ color: 0x2b3042 }), .5, 1.75, .7, P);
  scene.add(P);

  // ---------- Příšery ----------
  const TYPES = {
    crawler: { c: 0x3ddc5a, s: 1,   hp: 2,  sp: 3.4, dmg: 8,  pts: 10 },
    runner:  { c: 0xc6f03a, s: .6,  hp: 1,  sp: 7,   dmg: 5,  pts: 15 },
    spitter: { c: 0xb36bff, s: 1,   hp: 3,  sp: 2.6, dmg: 0,  pts: 25 },
    brute:   { c: 0xff6a4d, s: 1.9, hp: 12, sp: 2.1, dmg: 22, pts: 60 },
  };
  const eyeM = new THREE.MeshBasicMaterial({ color: 0xffffff }), blk = new THREE.MeshBasicMaterial({ color: 0x111111 });
  function mkAlien(type) {
    const T = TYPES[type], g = new THREE.Group(), body = new THREE.Group(), mat = new THREE.MeshStandardMaterial({ color: T.c, flatShading: true });
    const b = new THREE.Mesh(new THREE.SphereGeometry(.9, 14, 12), mat); b.position.y = 1; b.scale.y = .9; body.add(b);
    [-1, 1].forEach(s => {
      const e = new THREE.Mesh(new THREE.SphereGeometry(.2, 8, 8), eyeM); e.position.set(s * .33, 1.3, .72); body.add(e);
      const p = new THREE.Mesh(new THREE.SphereGeometry(.09, 8, 8), blk); p.position.set(s * .33, 1.3, .9); body.add(p);
      const a = new THREE.Mesh(new THREE.CylinderGeometry(.04, .04, .9), mat); a.position.set(s * .55, 2.1, 0); a.rotation.z = -s * .45; body.add(a);
      const t = new THREE.Mesh(new THREE.SphereGeometry(.11, 8, 8), type === 'spitter' ? eyeM : mat); t.position.set(s * .75, 2.5, 0); body.add(t);
    });
    box(.7, .24, .1, blk, 0, .75, .82, body);
    for (let i = 0; i < 4; i++) box(.1, .13, .06, eyeM, -.27 + i * .18, .8, .88, body);
    g.add(body);
    g.scale.setScalar(T.s);
    return { g, body, mat, type, T, hp: T.hp, cd: rnd(0, 1), flash: 0, ph: rnd(0, 6) };
  }

  // ---------- Stav hry ----------
  let G, yaw = 0, pitch = .25, keys = {}, firing = false, last = 0, locked = false;
  const pl = { p: new THREE.Vector3(), vy: 0, cd: 0, walk: 0 };
  const list = { en: [], bu: [], sh: [], pa: [] };

  function clear() { Object.values(list).forEach(l => l.forEach(o => scene.remove(o.g || o.m))); Object.keys(list).forEach(k => list[k] = []); }
  function newGame() {
    clear();
    G = { mode: 'start', hp: 100, score: 0, wave: 0, queue: [], spawnT: 0, delay: 0 };
    pl.p.set(0, H(0, 0), 0); pl.vy = 0;
    startWave();
    hud();
  }
  function startWave() {
    G.wave++;
    const w = G.wave, n = 4 + w * 3;
    for (let i = 0; i < n; i++) {
      const r = Math.random();
      let t = 'crawler';
      if (w >= 4 && r < .08 + w * .01) t = 'brute';
      else if (w >= 3 && r < .3) t = 'spitter';
      else if (w >= 2 && r < .55) t = 'runner';
      G.queue.push(t);
    }
    if (w >= 5 && w % 5 === 0) G.queue.push('brute', 'brute');
    banner('Vlna ' + w);
  }
  function banner(t) {
    const b = $('banner'); b.textContent = t; b.style.opacity = 1;
    setTimeout(() => b.style.opacity = 0, 1800);
  }
  function hud() {
    $('hp').style.width = Math.max(0, G.hp) + '%';
    $('hp').style.background = G.hp > 50 ? '#4be08a' : G.hp > 25 ? '#ffd24a' : '#ff4d5e';
    $('wave').textContent = G.wave;
    $('score').textContent = G.score;
    $('left').textContent = list.en.length + G.queue.length;
  }
  function spawn(type) {
    const a = rnd(0, 6.28), d = rnd(40, 65);
    const x = THREE.MathUtils.clamp(pl.p.x + Math.cos(a) * d, -105, 105), z = THREE.MathUtils.clamp(pl.p.z + Math.sin(a) * d, -105, 105);
    const e = mkAlien(type);
    e.g.position.set(x, H(x, z), z);
    scene.add(e.g); list.en.push(e);
  }
  function burst(pos, color, n = 10) {
    for (let i = 0; i < n; i++) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(.18, .18, .18), new THREE.MeshBasicMaterial({ color, transparent: true }));
      m.position.copy(pos); scene.add(m);
      list.pa.push({ m, v: new THREE.Vector3(rnd(-5, 5), rnd(0, 7), rnd(-5, 5)), life: .8 });
    }
  }
  function hurt(d) {
    G.hp -= d; hud();
    if (G.hp <= 0) {
      G.mode = 'over'; document.exitPointerLock();
      show('Konec hry', 'Dosáhl jsi vlny ' + G.wave + ' se skórem ' + G.score + '. Klikni pro novou hru.');
    }
  }
  function show(t, s) { $('title').textContent = t; $('sub').textContent = s; $('msg').classList.remove('hidden'); }

  // ---------- Střelba ----------
  const fwd = new THREE.Vector3(), tmp = new THREE.Vector3();
  function shoot() {
    const muzzle = new THREE.Vector3(Math.cos(yaw) * .5 - Math.sin(yaw) * .9, 1.75, -Math.sin(yaw) * .5 - Math.cos(yaw) * .9).add(pl.p);
    const aim = camera.position.clone().addScaledVector(fwd, 60);
    const v = aim.sub(muzzle).normalize().multiplyScalar(65);
    const m = new THREE.Mesh(new THREE.SphereGeometry(.14, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffe066 }));
    m.position.copy(muzzle); scene.add(m);
    list.bu.push({ m, v, life: 2 });
    pl.cd = .16;
  }

  // ---------- Update ----------
  function update(dt, t) {
    fwd.set(-Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
    const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    const f2 = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));

    if (G.mode === 'play') {
      // pohyb
      const mv = new THREE.Vector3();
      if (keys.w) mv.add(f2); if (keys.s) mv.sub(f2);
      if (keys.d) mv.add(right); if (keys.a) mv.sub(right);
      const moving = mv.lengthSq() > 0;
      if (moving) pl.p.addScaledVector(mv.normalize(), 9 * dt);
      const r = Math.hypot(pl.p.x, pl.p.z);
      if (r > 105) pl.p.multiplyScalar(105 / r);
      const gh = H(pl.p.x, pl.p.z);
      pl.vy -= 16 * dt; pl.p.y += pl.vy * dt;
      if (pl.p.y <= gh) { pl.p.y = gh; pl.vy = 0; if (keys[' ']) pl.vy = 8; }
      pl.walk += moving ? dt * 10 : 0;
      legs[0].rotation.x = moving ? Math.sin(pl.walk) * .7 : 0;
      legs[1].rotation.x = moving ? -Math.sin(pl.walk) * .7 : 0;
      pl.cd -= dt;
      if (firing && pl.cd <= 0) shoot();

      // vlny
      G.spawnT -= dt;
      if (G.queue.length && G.spawnT <= 0 && list.en.length < 25) { spawn(G.queue.shift()); G.spawnT = .6; }
      if (!G.queue.length && !list.en.length) { G.delay -= dt; if (G.delay <= 0) startWave(); } else G.delay = 3;

      // nepřátelé
      for (const e of list.en) {
        const p = e.g.position, d = tmp.set(pl.p.x - p.x, 0, pl.p.z - p.z), dist = d.length();
        d.normalize();
        let dir = 1;
        if (e.type === 'spitter') {
          dir = dist > 16 ? 1 : dist < 10 ? -1 : 0;
          e.cd -= dt;
          if (e.cd <= 0 && dist < 40) {
            e.cd = 2.2;
            const m = new THREE.Mesh(new THREE.SphereGeometry(.3, 8, 8), new THREE.MeshBasicMaterial({ color: 0xd49bff }));
            m.position.set(p.x, p.y + 1.3, p.z); scene.add(m);
            const v = new THREE.Vector3(pl.p.x - p.x, pl.p.y + 1.5 - p.y - 1.3, pl.p.z - p.z).normalize().multiplyScalar(16);
            list.sh.push({ m, v, life: 4 });
          }
        }
        p.x += d.x * e.T.sp * dir * dt; p.z += d.z * e.T.sp * dir * dt;
        p.y = H(p.x, p.z) + Math.abs(Math.sin(t * 6 + e.ph)) * .25 * e.T.s;
        e.g.rotation.y = Math.atan2(d.x, d.z);
        e.body.rotation.z = Math.sin(t * 5 + e.ph) * .08;
        e.cd -= e.type === 'spitter' ? 0 : dt;
        if (e.T.dmg && dist < 1.3 * e.T.s + .8 && e.cd <= 0) { e.cd = 1; hurt(e.T.dmg); }
        if (e.flash > 0) { e.flash -= dt; e.mat.emissive.setHex(e.flash > 0 ? 0xffffff : 0); }
      }

      // střely hráče
      for (const b of list.bu) {
        b.m.position.addScaledVector(b.v, dt); b.life -= dt;
        if (b.m.position.y < H(b.m.position.x, b.m.position.z)) b.life = 0;
        for (const e of list.en) {
          const c = e.g.position;
          if (b.m.position.distanceTo(tmp.set(c.x, c.y + e.T.s, c.z)) < 1.05 * e.T.s + .2) {
            b.life = 0; e.hp--; e.flash = .08;
            if (e.hp <= 0) { e.dead = true; G.score += e.T.pts; burst(tmp, e.T.c, 14); }
            break;
          }
        }
      }
      // střely příšer
      for (const s of list.sh) {
        s.m.position.addScaledVector(s.v, dt); s.life -= dt;
        if (s.m.position.distanceTo(tmp.set(pl.p.x, pl.p.y + 1.4, pl.p.z)) < 1.2) { s.life = 0; hurt(10); burst(s.m.position, 0xd49bff, 6); }
        if (s.m.position.y < H(s.m.position.x, s.m.position.z)) s.life = 0;
      }
      list.en = list.en.filter(e => { if (e.dead) scene.remove(e.g); return !e.dead; });
      hud();
    }
    // úklid + částice
    ['bu', 'sh'].forEach(k => list[k] = list[k].filter(o => { if (o.life <= 0) scene.remove(o.m); return o.life > 0; }));
    list.pa.forEach(p => { p.life -= dt; p.v.y -= 12 * dt; p.m.position.addScaledVector(p.v, dt); p.m.material.opacity = Math.max(0, p.life / .8); });
    list.pa = list.pa.filter(p => { if (p.life <= 0) scene.remove(p.m); return p.life > 0; });

    // postava + kamera za zády
    P.position.copy(pl.p);
    P.rotation.y = yaw + Math.PI;
    const target = tmp.set(pl.p.x, pl.p.y + 2, pl.p.z).addScaledVector(right, .9);
    camera.position.copy(target).addScaledVector(fwd, -6.5);
    camera.position.y = Math.max(camera.position.y, H(camera.position.x, camera.position.z) + .6);
    camera.lookAt(camera.position.clone().add(fwd));
  }

  // ---------- Ovládání ----------
  addEventListener('keydown', e => { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = true; if (e.key === ' ') e.preventDefault(); });
  addEventListener('keyup', e => keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false);
  addEventListener('mousemove', e => {
    if (!locked) return;
    yaw -= e.movementX * .0025;
    pitch = THREE.MathUtils.clamp(pitch + e.movementY * .0025, -.5, 1);
  });
  addEventListener('mousedown', e => { if (locked && e.button === 0) firing = true; });
  addEventListener('mouseup', () => firing = false);
  $('msg').addEventListener('click', () => {
    if (G.mode === 'over') newGame();
    renderer.domElement.requestPointerLock();
  });
  document.addEventListener('pointerlockchange', () => {
    locked = document.pointerLockElement === renderer.domElement;
    if (locked) { if (G.mode !== 'over') G.mode = 'play'; $('msg').classList.add('hidden'); }
    else { firing = false; keys = {}; if (G.mode === 'play') { G.mode = 'pause'; show('Pauza', 'Klikni pro pokračování.'); } }
  });
  addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

  function loop(ms) {
    const dt = Math.min((ms - last) / 1000, .05); last = ms;
    update(dt, ms / 1000);
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  newGame();
  requestAnimationFrame(ms => { last = ms; loop(ms); });
})();
</script>
</body>
</html>
