<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Měsíc 3D – vlny příšer</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: "Trebuchet MS", "Segoe UI", sans-serif; color: #eef1ff; }
  canvas { display: block; }
  #hud { position: fixed; top: 12px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; text-shadow: 0 1px 4px #000; font-size: 1.05rem; }
  #bar { width: 220px; height: 14px; background: #1b2236; border: 2px solid #eef1ff; border-radius: 8px; overflow: hidden; margin-top: 4px; }
  #hp { height: 100%; width: 100%; background: #4be08a; transition: width .15s; }
  #cross { position: fixed; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border: 2px solid #fff; border-radius: 50%; opacity: .8; pointer-events: none; }
  #banner { position: fixed; top: 22%; width: 100%; text-align: center; font-size: clamp(2rem, 7vw, 4rem); font-weight: bold; opacity: 0; pointer-events: none; text-shadow: 0 2px 10px #000; transition: opacity .5s; }
  #msg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: rgba(0,0,0,.72); text-align: center; cursor: pointer; padding: 20px; }
  #msg h1 { margin: 0; font-size: clamp(1.8rem, 6vw, 3rem); }
  #msg p { margin: 0; color: #a9b3df; }
  #msg.hidden { display: none; }
</style>
</head>
<body>
<div id="hud">
  <div>Zdraví<div id="bar"><div id="hp"></div></div></div>
  <div style="text-align:center">Vlna <b id="wave">1</b><br>Zbývá nepřátel: <b id="left">0</b></div>
  <div style="text-align:right">Skóre: <b id="score">0</b></div>
</div>
<div id="cross"></div>
<div id="banner"></div>
<div id="msg">
  <h1 id="title">Měsíc 3D</h1>
  <p id="sub">Přežij vlny příšer na povrchu Měsíce.</p>
  <p>WASD – pohyb · myš – rozhlížení · levé tlačítko – střelba · mezerník – skok · Esc – pauza</p>
  <p><b>Klikni pro start</b></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);
  scene.fog = new THREE.Fog(0x04060e, 60, 150);
  const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 600);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0x5f78c8, 0x2a2a34, 0.55));
  const sun = new THREE.DirectionalLight(0xfff1dc, 2.6);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  const sc = sun.shadow.camera; sc.left = sc.bottom = -45; sc.right = sc.top = 45; sc.near = 10; sc.far = 220;
  sun.shadow.bias = -.0004; sun.shadow.normalBias = .05;
  scene.add(sun, sun.target);
  const rimL = new THREE.DirectionalLight(0x4f8cff, .8); rimL.position.set(-60, 30, -80); scene.add(rimL);
  const flashL = new THREE.PointLight(0x66e6ff, 0, 14); scene.add(flashL);

  // ---------- Prostředí ----------
  const craters = [];
  for (let i = 0; i < 16; i++) {
    const a = rnd(0, 6.28), d = rnd(18, 95);
    craters.push({ x: Math.cos(a) * d, z: Math.sin(a) * d, r: rnd(5, 12) });
  }
  function H(x, z) {
    let h = Math.sin(x * .05) * Math.cos(z * .04) * 2.2 + Math.sin(x * .13 + z * .09) * .7;
    for (const c of craters) {
      const d = Math.hypot(x - c.x, z - c.z) / c.r;
      if (d < 1) h -= (1 - d * d) * c.r * .3;
      else if (d < 1.35) h += Math.sin((d - 1) / .35 * Math.PI) * c.r * .08;
    }
    return h;
  }
  const tg = new THREE.PlaneGeometry(260, 260, 130, 130);
  tg.rotateX(-Math.PI / 2);
  const tp = tg.attributes.position;
  const cols = [];
  for (let i = 0; i < tp.count; i++) {
    const x = tp.getX(i), z = tp.getZ(i), y = H(x, z);
    tp.setY(i, y);
    const v = .36 + Math.max(-.14, Math.min(.12, y * .05)) + Math.sin(x * .45) * Math.cos(z * .41) * .03;
    cols.push(v, v * .985, v * 1.02);
  }
  tg.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  tg.computeVertexNormals();
  const ground = new THREE.Mesh(tg, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, flatShading: true }));
  ground.receiveShadow = true; scene.add(ground);

  const rockM = new THREE.MeshStandardMaterial({ color: 0x6c6e78, flatShading: true });
  for (let i = 0; i < 45; i++) {
    const x = rnd(-110, 110), z = rnd(-110, 110);
    if (Math.hypot(x, z) < 8) continue;
    const r = new THREE.Mesh(new THREE.DodecahedronGeometry(rnd(.5, 1.6)), rockM);
    r.position.set(x, H(x, z) + .2, z);
    r.rotation.set(rnd(0, 3), rnd(0, 3), 0); r.castShadow = r.receiveShadow = true;
    scene.add(r);
  }
  const sp = [];
  for (let i = 0; i < 900; i++) { const a = rnd(0, 6.28), e = rnd(.05, 1.3), r = 400; sp.push(Math.cos(a) * Math.cos(e) * r, Math.sin(e) * r, Math.sin(a) * Math.cos(e) * r); }
  const sgeo = new THREE.BufferGeometry();
  sgeo.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
  scene.add(new THREE.Points(sgeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, fog: false })));
  const earth = new THREE.Mesh(new THREE.SphereGeometry(40, 32, 32), new THREE.MeshBasicMaterial({ color: 0x3a7bd5, fog: false }));
  earth.position.set(-220, 160, -330);
  scene.add(earth);
  const glow = new THREE.Mesh(new THREE.SphereGeometry(46, 32, 32), new THREE.MeshBasicMaterial({ color: 0x6fb4ff, transparent: true, opacity: .18, blending: THREE.AdditiveBlending, fog: false, depthWrite: false }));
  glow.position.copy(earth.position); scene.add(glow);

  // ---------- Astronaut ----------
  const mat = (c, r = .6, m = 0, e = 0, ei = 1) => { const x = new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m }); if (e) { x.emissive = new THREE.Color(e); x.emissiveIntensity = ei; } x.userData.e = e; return x; };
  const mesh = (g, m, x, y, z, par) => { const o = new THREE.Mesh(g, m); o.position.set(x, y, z); par.add(o); return o; };
  const BX = (w, h, d) => new THREE.BoxGeometry(w, h, d), SP = (r, s = 16) => new THREE.SphereGeometry(r, s, s), CY = (a, b, h, s = 12) => new THREE.CylinderGeometry(a, b, h, s), CO = (r, h, s = 6) => new THREE.ConeGeometry(r, h, s), DO = r => new THREE.DodecahedronGeometry(r, 0);
  const suit = mat(0xeef0f6, .5, .05), grey = mat(0x6b7283, .35, .8), dark = mat(0x1f2433, .6, .3), orange = mat(0xff7a1a, .5, .1), cyan = mat(0x0a2a33, .3, 0, 0x35e6ff, 2.2), gold = mat(0x120d03, .06, 1, 0x5a3b00, .9);
  const P = new THREE.Group();
  mesh(BX(.95, 1.05, .6), suit, 0, 1.55, 0, P);
  mesh(BX(.55, .42, .1), dark, 0, 1.72, .3, P);
  [[-.15, cyan], [0, orange], [.15, cyan]].forEach(([x, m]) => mesh(BX(.09, .09, .05), m, x, 1.76, .36, P));
  mesh(BX(1.02, .16, .66), grey, 0, 1.02, 0, P); mesh(BX(.86, .3, .56), suit, 0, .9, 0, P);
  mesh(CY(.34, .38, .16), grey, 0, 2.14, 0, P);
  mesh(SP(.5, 24), suit, 0, 2.55, 0, P);
  mesh(SP(.4, 24), gold, 0, 2.54, .22, P).scale.set(1, .85, .62);
  mesh(new THREE.TorusGeometry(.37, .045, 8, 28), grey, 0, 2.54, .33, P).scale.y = .85;
  [-1, 1].forEach(s => { mesh(BX(.1, .12, .16), cyan, s * .46, 2.62, .12, P); mesh(SP(.17), suit, s * .66, 1.98, 0, P); mesh(CY(.17, .17, .06), orange, s * .66, 1.98, 0, P).rotation.z = Math.PI / 2; mesh(CY(.17, .17, .95), suit, s * .22, 1.7, -.82, P); mesh(CY(.18, .18, .1), orange, s * .22, 2.2, -.82, P); });
  mesh(CY(.02, .02, .45, 6), grey, .32, 3.0, -.15, P); mesh(SP(.05, 8), mat(0xff2020, .3, 0, 0xff2020, 3), .32, 3.24, -.15, P);
  mesh(BX(.8, 1, .4), grey, 0, 1.6, -.5, P);
  function arm(s, rx, rz) { const a = new THREE.Group(); a.position.set(s * .62, 2.0, 0); mesh(CY(.13, .12, .55), suit, 0, -.28, 0, a); mesh(SP(.13), grey, 0, -.56, 0, a); mesh(CY(.12, .1, .5), suit, 0, -.84, 0, a); mesh(SP(.15), dark, 0, -1.12, 0, a); a.rotation.set(rx, 0, rz); P.add(a); }
  arm(-1, -.5, -.15); arm(1, -1.4, 0);
  const gun = new THREE.Group(); gun.position.set(.62, 1.8, 1.0); P.add(gun);
  mesh(BX(.16, .22, .7), dark, 0, 0, 0, gun); mesh(BX(.1, .22, .12), grey, 0, -.2, -.1, gun);
  mesh(CY(.045, .045, .7), grey, 0, .02, .6, gun).rotation.x = Math.PI / 2;
  mesh(BX(.1, .1, .3), cyan, 0, .13, .05, gun); mesh(CY(.07, .07, .08), orange, 0, .02, .97, gun).rotation.x = Math.PI / 2;
  const legs = [-1, 1].map(s => { const h = new THREE.Group(); h.position.set(s * .24, 1.05, 0); mesh(CY(.17, .15, .45), suit, 0, -.225, 0, h); mesh(SP(.16), grey, 0, -.45, 0, h); const k = new THREE.Group(); k.position.y = -.45; h.add(k); mesh(CY(.15, .13, .45), suit, 0, -.225, 0, k); mesh(BX(.3, .18, .46), dark, 0, -.52, .06, k); mesh(BX(.33, .06, .5), orange, 0, -.6, .06, k); h.userData.k = k; P.add(h); return h; });
  P.traverse(o => o.isMesh && (o.castShadow = true));
  scene.add(P);

  // ---------- Příšery ----------
  const TYPES = {
    crawler: { c: 0x38c954, s: 1,    hp: 2,  sp: 3.4, dmg: 8,  pts: 10, cy: 1.05, r: 1.35 },
    runner:  { c: 0xd6a21a, s: .85,  hp: 1,  sp: 7.5, dmg: 6,  pts: 15, cy: .65,  r: 1.3 },
    spitter: { c: 0x8a4dff, s: 1,    hp: 3,  sp: 2.6, dmg: 0,  pts: 25, cy: 1.8,  r: 1.4, hover: 1.2 },
    brute:   { c: 0xff5a1a, s: 1.35, hp: 14, sp: 2.0, dmg: 22, pts: 60, cy: 2.7,  r: 2.1 },
  };
  function mkAlien(type) {
    const T = TYPES[type], g = new THREE.Group(), body = new THREE.Group(), mats = [], parts = []; g.add(body);
    const M = (...a) => { const x = mat(...a); mats.push(x); return x; };
    const eyeW = M(0xffffff, .2, 0, 0xffffff, .3), blk = M(0x0a0a0a, .3);
    let anim;
    if (type === 'crawler') { // zelená chlupatá bublina s tesáky a šesti nohama
      const sk = M(0x38c954, .7), dk = M(0x1d7a32, .85), tooth = M(0xfff2cc, .4), mouth = M(0x3a0612, .9), tip = M(0x333300, .3, 0, 0xffee55, 2.5);
      mesh(SP(.95, 20), sk, 0, 1.05, 0, body).scale.set(1.05, .9, 1);
      for (let i = 0; i < 7; i++) { const a = i * .9; mesh(SP(.17, 8), dk, Math.cos(a) * .55, 1.55 + Math.sin(i) * .1, Math.sin(a) * .5 - .2, body); }
      mesh(SP(.5, 14), mouth, 0, .82, .66, body).scale.set(1.25, .6, .5);
      for (let i = 0; i < 5; i++) { const x = -.4 + i * .2; mesh(CO(.07, .22), tooth, x, .98, .86, body).rotation.x = Math.PI; mesh(CO(.07, .2), tooth, x, .66, .84, body); }
      [-1, 1].forEach(s => { mesh(SP(.2, 12), eyeW, s * .38, 1.42, .74, body); mesh(SP(.09, 8), blk, s * .38, 1.42, .92, body); mesh(CY(.04, .04, .95, 6), dk, s * .5, 2.1, -.05, body).rotation.z = -s * .4; mesh(SP(.12, 8), tip, s * .72, 2.52, -.05, body); });
      for (let i = 0; i < 6; i++) { const s = i % 2 ? 1 : -1, l = new THREE.Group(); l.position.set(s * .75, .55, -.5 + (i >> 1) * .5); mesh(CY(.09, .04, .95, 6), dk, s * .45, 0, 0, l).rotation.z = Math.PI / 2; l.userData.s = s; body.add(l); parts.push(l); }
      anim = t => parts.forEach((l, i) => l.rotation.z = -l.userData.s * (.7 + Math.sin(t * 11 + i * 1.7) * .3));
    } else if (type === 'runner') { // nízký rychlý brouk s čepelemi
      const sh = M(0xd6a21a, .3, .5), dk = M(0x2e2006, .6), glow = M(0x401000, .3, 0, 0xff3010, 2.5), blade = M(0xe8e8f0, .15, 1);
      mesh(SP(.6, 16), sh, 0, .72, -.55, body).scale.set(.85, .6, 1.7);
      for (let i = 0; i < 4; i++) mesh(BX(.95 - i * .08, .06, .12), dk, 0, .98, -.2 - i * .38, body);
      mesh(SP(.42, 14), sh, 0, .78, .5, body).scale.set(1, .75, 1.2);
      mesh(SP(.3, 12), sh, 0, .72, 1.1, body).scale.set(1, .85, 1);
      [-1, 1].forEach(s => {
        mesh(SP(.11, 8), glow, s * .17, .8, 1.3, body); mesh(CO(.06, .35), dk, s * .13, .55, 1.4, body).rotation.x = Math.PI / 2;
        const bl = new THREE.Group(); bl.position.set(s * .38, .85, 1.0); mesh(BX(.07, .07, .8), sh, 0, 0, .35, bl); mesh(BX(.03, .28, .6), blade, 0, -.12, .55, bl); bl.rotation.y = -s * .25; body.add(bl);
      });
      for (let i = 0; i < 6; i++) { const s = i % 2 ? 1 : -1, l = new THREE.Group(); l.position.set(s * .3, .75, .75 - (i >> 1) * .5); mesh(CY(.03, .02, 1.2, 5), dk, s * .6, 0, 0, l).rotation.z = Math.PI / 2; l.userData.s = s; body.add(l); parts.push(l); }
      anim = t => parts.forEach((l, i) => l.rotation.set(0, Math.sin(t * 20 + i * 2.1) * .45, -l.userData.s * .9));
    } else if (type === 'spitter') { // levitující medúza s chapadly
      const dm = M(0x8a4dff, .25, .1, 0x2a0a60, .8), core = M(0x200020, .3, 0, 0xff3df2, 3), eye = M(0x222200, .3, 0, 0xffe94a, 2.5), ten = M(0x6a35c8, .5);
      dm.transparent = true; dm.opacity = .88;
      mesh(new THREE.SphereGeometry(.95, 22, 14, 0, Math.PI * 2, 0, Math.PI / 2), dm, 0, 1.75, 0, body).scale.y = .95;
      mesh(CY(.95, .8, .14, 20), ten, 0, 1.75, 0, body);
      mesh(SP(.36, 14), core, 0, 1.85, 0, body);
      for (let i = 0; i < 6; i++) { const a = i * 1.047; mesh(SP(.09, 8), core, Math.cos(a) * .75, 2.05 + (i % 2) * .12, Math.sin(a) * .75, body); }
      [-1, 1].forEach(s => mesh(SP(.13, 10), eye, s * .35, 1.95, .88, body));
      for (let i = 0; i < 9; i++) { const a = i * .698, q = new THREE.Group(); q.position.set(Math.cos(a) * .6, 1.72, Math.sin(a) * .6); mesh(CY(.08, .02, 1.7, 6), ten, 0, -.85, 0, q); mesh(SP(.06, 6), core, 0, -1.7, 0, q); body.add(q); parts.push(q); }
      anim = t => parts.forEach((q, i) => q.rotation.set(Math.sin(t * 3 + i) * .35, 0, Math.cos(t * 2.4 + i * 1.3) * .35));
    } else { // obří kamenný golem s lávovými trhlinami
      const rk = M(0x3b3d48, .95, .1), rk2 = M(0x262833, .95), lv = M(0x300600, .4, 0, 0xff4a0a, 2.4);
      mesh(DO(.95), rk, 0, 2.1, 0, body).scale.set(1.25, 1.2, .9);
      mesh(DO(.6), rk2, 0, 1.3, 0, body); mesh(DO(.42), rk, 0, 3.05, .15, body);
      [-.18, .18].forEach(x => mesh(BX(.16, .07, .06), lv, x, 3.08, .52, body));
      [[-.3, 0], [.25, .4], [0, -.35]].forEach(([x, r]) => mesh(BX(.07, .75, .05), lv, x, 2.1, .83, body).rotation.z = r);
      [-1, 1].forEach(s => {
        mesh(CO(.22, .7, 5), rk2, s * .95, 3.0, 0, body).rotation.z = -s * .5;
        const a = new THREE.Group(); a.position.set(s * 1.3, 2.6, 0); mesh(DO(.42), rk, 0, -.5, 0, a).scale.y = 1.5; mesh(BX(.55, .08, .55), lv, 0, -.95, 0, a); mesh(DO(.55), rk2, 0, -1.5, 0, a); a.userData = { s, k: 'a' }; body.add(a); parts.push(a);
        const l = new THREE.Group(); l.position.set(s * .5, 1.1, 0); mesh(CY(.3, .38, 1.0, 6), rk2, 0, -.5, 0, l); mesh(BX(.65, .25, .9), rk, 0, -1.0, .12, l); l.userData = { s, k: 'l' }; body.add(l); parts.push(l);
      });
      anim = t => parts.forEach(p => p.rotation.x = Math.sin(t * 3.5) * (p.userData.k === 'a' ? -1 : 1) * p.userData.s * .5);
    }
    g.scale.setScalar(T.s);
    g.traverse(o => o.isMesh && (o.castShadow = true));
    return { g, body, mats, anim, type, T, hp: T.hp, cd: rnd(0, 1), flash: 0, ph: rnd(0, 6) };
  }

  // ---------- Stav hry ----------
  let G, yaw = 0, pitch = .25, keys = {}, firing = false, last = 0, locked = false;
  const pl = { p: new THREE.Vector3(), vy: 0, cd: 0, walk: 0 };
  const list = { en: [], bu: [], sh: [], pa: [] };

  function clear() { Object.values(list).forEach(l => l.forEach(o => scene.remove(o.g || o.m))); Object.keys(list).forEach(k => list[k] = []); }
  function newGame() {
    clear();
    G = { mode: 'start', hp: 100, score: 0, wave: 0, queue: [], spawnT: 0, delay: 0 };
    pl.p.set(0, H(0, 0), 0); pl.vy = 0;
    startWave();
    hud();
  }
  function startWave() {
    G.wave++;
    const w = G.wave, n = 4 + w * 3;
    for (let i = 0; i < n; i++) {
      const r = Math.random();
      let t = 'crawler';
      if (w >= 4 && r < .08 + w * .01) t = 'brute';
      else if (w >= 3 && r < .3) t = 'spitter';
      else if (w >= 2 && r < .55) t = 'runner';
      G.queue.push(t);
    }
    if (w >= 5 && w % 5 === 0) G.queue.push('brute', 'brute');
    banner('Vlna ' + w);
  }
  function banner(t) {
    const b = $('banner'); b.textContent = t; b.style.opacity = 1;
    setTimeout(() => b.style.opacity = 0, 1800);
  }
  function hud() {
    $('hp').style.width = Math.max(0, G.hp) + '%';
    $('hp').style.background = G.hp > 50 ? '#4be08a' : G.hp > 25 ? '#ffd24a' : '#ff4d5e';
    $('wave').textContent = G.wave;
    $('score').textContent = G.score;
    $('left').textContent = list.en.length + G.queue.length;
  }
  function spawn(type) {
    const a = rnd(0, 6.28), d = rnd(40, 65);
    const x = THREE.MathUtils.clamp(pl.p.x + Math.cos(a) * d, -105, 105), z = THREE.MathUtils.clamp(pl.p.z + Math.sin(a) * d, -105, 105);
    const e = mkAlien(type);
    e.g.position.set(x, H(x, z), z);
    scene.add(e.g); list.en.push(e);
  }
  function burst(pos, color, n = 10) {
    for (let i = 0; i < n; i++) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(.18, .18, .18), new THREE.MeshBasicMaterial({ color, transparent: true }));
      m.position.copy(pos); scene.add(m);
      list.pa.push({ m, v: new THREE.Vector3(rnd(-5, 5), rnd(0, 7), rnd(-5, 5)), life: .8 });
    }
  }
  function hurt(d) {
    G.hp -= d; hud();
    if (G.hp <= 0) {
      G.mode = 'over'; document.exitPointerLock();
      show('Konec hry', 'Dosáhl jsi vlny ' + G.wave + ' se skórem ' + G.score + '. Klikni pro novou hru.');
    }
  }
  function show(t, s) { $('title').textContent = t; $('sub').textContent = s; $('msg').classList.remove('hidden'); }

  // ---------- Střelba ----------
  const fwd = new THREE.Vector3(), tmp = new THREE.Vector3();
  function shoot() {
    const muzzle = new THREE.Vector3(Math.cos(yaw) * .62 - Math.sin(yaw) * 1.5, 1.8, -Math.sin(yaw) * .62 - Math.cos(yaw) * 1.5).add(pl.p);
    const aim = camera.position.clone().addScaledVector(fwd, 60);
    const v = aim.sub(muzzle).normalize().multiplyScalar(65);
    const m = new THREE.Mesh(new THREE.SphereGeometry(.14, 8, 8), new THREE.MeshBasicMaterial({ color: 0x7df4ff }));
    m.position.copy(muzzle); scene.add(m);
    list.bu.push({ m, v, life: 2 });
    pl.cd = .16; flashL.position.copy(muzzle); flashL.intensity = 8;
  }

  // ---------- Update ----------
  function update(dt, t) {
    fwd.set(-Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
    const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    const f2 = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));

    if (G.mode === 'play') {
      // pohyb
      const mv = new THREE.Vector3();
      if (keys.w) mv.add(f2); if (keys.s) mv.sub(f2);
      if (keys.d) mv.add(right); if (keys.a) mv.sub(right);
      const moving = mv.lengthSq() > 0;
      if (moving) pl.p.addScaledVector(mv.normalize(), 9 * dt);
      const r = Math.hypot(pl.p.x, pl.p.z);
      if (r > 105) pl.p.multiplyScalar(105 / r);
      const gh = H(pl.p.x, pl.p.z);
      pl.vy -= 16 * dt; pl.p.y += pl.vy * dt;
      if (pl.p.y <= gh) { pl.p.y = gh; pl.vy = 0; if (keys[' ']) pl.vy = 8; }
      pl.walk += moving ? dt * 10 : 0;
      legs[0].rotation.x = moving ? Math.sin(pl.walk) * .7 : 0;
      legs[1].rotation.x = moving ? -Math.sin(pl.walk) * .7 : 0;
      legs.forEach((l, i) => l.userData.k.rotation.x = moving ? Math.max(0, Math.sin(pl.walk + (i ? Math.PI : 0) + 1)) * .9 : 0);
      pl.cd -= dt;
      if (firing && pl.cd <= 0) shoot();

      // vlny
      G.spawnT -= dt;
      if (G.queue.length && G.spawnT <= 0 && list.en.length < 25) { spawn(G.queue.shift()); G.spawnT = .6; }
      if (!G.queue.length && !list.en.length) { G.delay -= dt; if (G.delay <= 0) startWave(); } else G.delay = 3;

      // nepřátelé
      for (const e of list.en) {
        const p = e.g.position, d = tmp.set(pl.p.x - p.x, 0, pl.p.z - p.z), dist = d.length();
        d.normalize();
        let dir = 1;
        if (e.type === 'spitter') {
          dir = dist > 16 ? 1 : dist < 10 ? -1 : 0;
          e.cd -= dt;
          if (e.cd <= 0 && dist < 40) {
            e.cd = 2.2;
            const m = new THREE.Mesh(new THREE.SphereGeometry(.3, 8, 8), new THREE.MeshBasicMaterial({ color: 0xd49bff }));
            m.position.set(p.x, p.y + 1.3, p.z); scene.add(m);
            const v = new THREE.Vector3(pl.p.x - p.x, pl.p.y + 1.5 - p.y - 1.3, pl.p.z - p.z).normalize().multiplyScalar(16);
            list.sh.push({ m, v, life: 4 });
          }
        }
        p.x += d.x * e.T.sp * dir * dt; p.z += d.z * e.T.sp * dir * dt;
        p.y = H(p.x, p.z) + Math.abs(Math.sin(t * 6 + e.ph)) * .25 * e.T.s + (e.T.hover || 0);
        e.g.rotation.y = Math.atan2(d.x, d.z);
        e.body.rotation.z = e.type === 'crawler' ? Math.sin(t * 5 + e.ph) * .08 : 0; if (e.anim) e.anim(t);
        e.cd -= e.type === 'spitter' ? 0 : dt;
        if (e.T.dmg && dist < 1.3 * e.T.s + .8 && e.cd <= 0) { e.cd = 1; hurt(e.T.dmg); }
        if (e.flash > 0) { e.flash -= dt; e.mats.forEach(m => m.emissive.setHex(e.flash > 0 ? 0xffffff : m.userData.e)); }
      }

      // střely hráče
      for (const b of list.bu) {
        b.m.position.addScaledVector(b.v, dt); b.life -= dt;
        if (b.m.position.y < H(b.m.position.x, b.m.position.z)) b.life = 0;
        for (const e of list.en) {
          const c = e.g.position;
          if (b.m.position.distanceTo(tmp.set(c.x, c.y + e.T.cy, c.z)) < e.T.r) {
            b.life = 0; e.hp--; e.flash = .08;
            if (e.hp <= 0) { e.dead = true; G.score += e.T.pts; burst(tmp, e.T.c, 14); }
            break;
          }
        }
      }
      // střely příšer
      for (const s of list.sh) {
        s.m.position.addScaledVector(s.v, dt); s.life -= dt;
        if (s.m.position.distanceTo(tmp.set(pl.p.x, pl.p.y + 1.4, pl.p.z)) < 1.2) { s.life = 0; hurt(10); burst(s.m.position, 0xd49bff, 6); }
        if (s.m.position.y < H(s.m.position.x, s.m.position.z)) s.life = 0;
      }
      list.en = list.en.filter(e => { if (e.dead) scene.remove(e.g); return !e.dead; });
      hud();
    }
    // úklid + částice
    ['bu', 'sh'].forEach(k => list[k] = list[k].filter(o => { if (o.life <= 0) scene.remove(o.m); return o.life > 0; }));
    list.pa.forEach(p => { p.life -= dt; p.v.y -= 12 * dt; p.m.position.addScaledVector(p.v, dt); p.m.material.opacity = Math.max(0, p.life / .8); });
    list.pa = list.pa.filter(p => { if (p.life <= 0) scene.remove(p.m); return p.life > 0; });

    // postava + kamera za zády
    P.position.copy(pl.p); sun.position.set(pl.p.x + 50, pl.p.y + 70, pl.p.z + 25); sun.target.position.copy(pl.p); sun.target.updateMatrixWorld();
    P.rotation.y = yaw + Math.PI;
    const target = tmp.set(pl.p.x, pl.p.y + 2, pl.p.z).addScaledVector(right, .9);
    camera.position.copy(target).addScaledVector(fwd, -6.5);
    camera.position.y = Math.max(camera.position.y, H(camera.position.x, camera.position.z) + .6);
    camera.lookAt(camera.position.clone().add(fwd));
  }

  // ---------- Ovládání ----------
  addEventListener('keydown', e => { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = true; if (e.key === ' ') e.preventDefault(); });
  addEventListener('keyup', e => keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false);
  addEventListener('mousemove', e => {
    if (!locked) return;
    yaw -= e.movementX * .0025;
    pitch = THREE.MathUtils.clamp(pitch + e.movementY * .0025, -.5, 1);
  });
  addEventListener('mousedown', e => { if (locked && e.button === 0) firing = true; });
  addEventListener('mouseup', () => firing = false);
  $('msg').addEventListener('click', () => {
    if (G.mode === 'over') newGame();
    renderer.domElement.requestPointerLock();
  });
  document.addEventListener('pointerlockchange', () => {
    locked = document.pointerLockElement === renderer.domElement;
    if (locked) { if (G.mode !== 'over') G.mode = 'play'; $('msg').classList.add('hidden'); }
    else { firing = false; keys = {}; if (G.mode === 'play') { G.mode = 'pause'; show('Pauza', 'Klikni pro pokračování.'); } }
  });
  addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

  function loop(ms) {
    const dt = Math.min((ms - last) / 1000, .05); last = ms;
    update(dt, ms / 1000); flashL.intensity *= Math.pow(.0005, dt);
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  newGame();
  requestAnimationFrame(ms => { last = ms; loop(ms); });
})();
</script>
</body>
